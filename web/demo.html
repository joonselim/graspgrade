<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="light only">
<title>GraspGrade 데모</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
  :root {
    --page: #eef0f3;
    --sheet: #ffffff;
    --ink: #1a1d23;
    --ink-2: #3b4250;
    --muted: #6a7382;
    --rule: #dde1e7;
    --link: #2350c9;
    --sheet-pad: 48px;
    color-scheme: light;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--page);
    color: var(--ink);
    font-family: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont,
      "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
    font-size: 15.5px;
    line-height: 1.7;
    word-break: keep-all;
  }
  a { color: var(--link); text-decoration: none; }
  a:hover { text-decoration: underline; }
  .sheet {
    max-width: 920px; margin: 28px auto 56px;
    background: var(--sheet); border: 1px solid var(--rule);
    padding: var(--sheet-pad);
  }
  @media (max-width: 720px) {
    :root { --sheet-pad: 16px; }
    .sheet { margin: 0; border: 0; }
  }
  .topnav {
    position: sticky; top: 0; z-index: 20;
    display: flex; align-items: center; gap: 22px;
    margin: calc(var(--sheet-pad) * -1) calc(var(--sheet-pad) * -1) 28px;
    padding: 0 var(--sheet-pad);
    background: var(--sheet); border-bottom: 1px solid var(--rule);
    font-size: 14px; overflow-x: auto; white-space: nowrap;
  }
  .topnav .brand { font-weight: 800; letter-spacing: -0.02em; margin-right: auto; padding: 14px 0; }
  .topnav a { color: var(--muted); padding: 14px 0 12px; border-bottom: 2px solid transparent; }
  .topnav a:hover { color: var(--ink); text-decoration: none; }
  .topnav a.on { color: var(--ink); font-weight: 650; border-bottom-color: var(--ink); }
  .topnav a.lang {
    padding: 3px 8px; border: 1px solid var(--rule); border-radius: 4px;
    font-size: 12px; font-weight: 600; color: var(--ink-2);
  }
  h1 { font-size: 30px; line-height: 1.3; letter-spacing: -0.02em; margin: 0 0 18px; }
  @media (max-width: 720px) { h1 { font-size: 25px; } }
  video { display: block; width: 100%; aspect-ratio: 16 / 9; background: #000; }
  .meta { margin: 10px 0 0; font-size: 13px; color: var(--muted); }
</style>
</head>
<body>
<main class="sheet">

  <nav class="topnav" aria-label="Pages">
    <span class="brand">GraspGrade</span>
    <a data-k="summary" href="index.html#summary">요약</a>
    <a data-k="story" href="index.html#story">핵심 실험</a>
    <a data-k="detail" href="index.html#detail">실험 상세</a>
    <a class="on" data-k="demo" href="demo.html">데모</a>
    <a class="lang" data-k="other" href="demo.html?lang=en" hreflang="en" lang="en">EN</a>
  </nav>

  <h1 data-k="title">3분 데모 영상</h1>
  <video src="assets/video/graspgrade_demo.mp4" poster="assets/video/graspgrade_demo_poster.jpg"
         controls playsinline preload="metadata"></video>
  <p class="meta" data-k="meta">영어 내레이션, 화면 자막 포함 · 2분 54초</p>
  <p class="meta" data-k="sources">영상 출처: OpenGraph Ego-Tactile (CC-BY-4.0), HOT3D (Meta), YouTube @Futur Decoded (첫 장면 대체 화면) · 음성: ElevenLabs</p>

</main>

<script>
(function () {
  "use strict";
  // The same English video for both languages; only the words around it change.
  var EN = {
    summary: ["Summary", "en.html#summary"],
    story: ["Key experiments", "en.html#story"],
    detail: ["Experiment log", "logs.html"],
    demo: ["Demo", "demo.html?lang=en"],
    other: ["KO", "demo.html"],
    title: ["3 minute demo video"],
    meta: ["English narration with captions on screen · 2:54"],
    sources: ["Video sources: OpenGraph Ego-Tactile (CC-BY-4.0), HOT3D (Meta), YouTube @Futur Decoded " +
              "(stand-in footage in the first scene) · Voice: ElevenLabs"]
  };
  if (new URLSearchParams(location.search).get("lang") !== "en") return;
  document.documentElement.lang = "en";
  document.title = "GraspGrade demo";
  document.querySelectorAll("[data-k]").forEach(function (el) {
    var v = EN[el.dataset.k];
    el.textContent = v[0];
    if (v[1]) el.setAttribute("href", v[1]);
  });
  var other = document.querySelector('[data-k="other"]');
  other.hreflang = "ko";
  other.lang = "ko";
})();
</script>
</body>
</html>
